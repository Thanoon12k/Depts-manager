name: Flutter tests
on:
  push:
    branches: [main]
    paths: ['lib/**', 'test/**', 'pubspec.*', '.github/workflows/flutter-test.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
